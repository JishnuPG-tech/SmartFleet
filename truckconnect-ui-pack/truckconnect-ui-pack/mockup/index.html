<!DOCTYPE html>
<html lang="en" data-theme="indigo" data-mode="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TruckConnect – Android App Screens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Malayalam:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f5f8;--surface:#fff;--surface-2:#f6f7fa;--border:#e7e9ee;--border-2:#d7dbe3;
  --text:#101319;--text-2:#4a5160;--muted:#8a90a0;
  --accent:#4f46e5;--accent-soft:#eef0ff;--accent-ink:#fff;
  --ok:#0b7d45;--warn:#a96b00;--crit:#c9342f;--info:#2563eb;--neutral:#6b7280;
  --shadow:0 1px 2px rgba(16,24,40,.05);--page:#eceef3;
  --map-land:#eef1f6;--map-sea:#f8fafd;--map-line:#cfd5e1;color-scheme:light;
}
html[data-theme=emerald]{--accent:#047857;--accent-soft:#e6f6ef}
html[data-theme=graphite]{--accent:#27272a;--accent-soft:#f0f0f1}
html[data-theme=sunset]{--accent:#d9480f;--accent-soft:#fff0e8}
html[data-mode=dark]{
  --bg:#0c0e12;--surface:#14171d;--surface-2:#1b1f26;--border:#262b34;--border-2:#343a46;
  --text:#eceef2;--text-2:#b6bcc9;--muted:#7f8696;--accent:#8b83ff;--accent-soft:#232245;--accent-ink:#0c0e12;
  --ok:#3cc47a;--warn:#e0a63a;--crit:#f0716c;--info:#6aa1ff;--neutral:#9aa1b0;--page:#090b0e;
  --map-land:#1c212b;--map-sea:#12151b;--map-line:#323948;color-scheme:dark;
}
html[data-mode=dark][data-theme=emerald]{--accent:#34d399;--accent-soft:#0f2a22}
html[data-mode=dark][data-theme=graphite]{--accent:#d4d4d8;--accent-soft:#25262b}
html[data-mode=dark][data-theme=sunset]{--accent:#fb923c;--accent-soft:#33200f}
*{box-sizing:border-box;margin:0}
body{font-family:'Plus Jakarta Sans','Noto Sans Malayalam',system-ui,sans-serif;background:var(--page);color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
button{font-family:inherit;cursor:pointer}
/* ---------- page chrome ---------- */
header.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.bar{max-width:1500px;margin:auto;padding:14px 32px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.brand b{display:block;font-size:15px;font-weight:800;letter-spacing:-.01em}.brand small{color:var(--muted);font-size:12px}
.tabs{display:flex;gap:4px;margin-left:12px;flex-wrap:wrap}
.tab{border:0;background:none;padding:9px 14px;border-radius:10px;font-weight:600;font-size:13.5px;color:var(--text-2)}
.tab:hover{background:var(--surface-2);color:var(--text)}
.tab.on{background:var(--accent-soft);color:var(--accent)}
.tab span{margin-left:6px;font-size:11px;color:var(--muted);font-weight:700}
.ctl{margin-left:auto;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 11px;border-radius:7px;color:var(--text-2);font-weight:600;font-size:12.5px}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.sw{display:flex;gap:8px}.sw button{width:24px;height:24px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--border-2);padding:0}
.sw button.on{box-shadow:0 0 0 2px var(--accent)}
main{max-width:1500px;margin:auto;padding:32px 32px 80px}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:8px 0 22px}
.sec-h h1{font-size:28px;font-weight:800;letter-spacing:-.02em}.sec-h p{color:var(--muted);margin-top:6px;max-width:720px;line-height:1.55}
.flow{margin:38px 0 6px;display:flex;align-items:center;gap:12px}
.flow h2{font-size:16px;font-weight:800;letter-spacing:-.01em}
.flow .tag{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.flow p{color:var(--muted);font-size:13px}
.flow hr{flex:1;border:0;border-top:1px solid var(--border-2)}
.grid{display:flex;flex-wrap:wrap;gap:36px 30px;margin-top:20px}
figure.fig{width:max-content}
figcaption{margin-top:14px;max-width:322px;font-size:12.5px;color:var(--muted);line-height:1.5}
figcaption b{display:block;color:var(--text);font-size:13.5px;margin-bottom:2px}
figcaption i{font-style:normal;font-family:ui-monospace,monospace;font-size:11px;color:var(--accent);background:var(--accent-soft);padding:1px 6px;border-radius:5px;margin-right:6px}
/* overview */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow)}
.card h3{font-size:14px;font-weight:700;margin-bottom:6px}.card p{color:var(--text-2);line-height:1.55;font-size:13px}
.big{font-size:34px;font-weight:800;letter-spacing:-.03em}
.journey{display:flex;align-items:center;gap:0;flex-wrap:wrap;margin-top:14px}
.jn{display:flex;align-items:center}
.jn span{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:7px 11px;font-size:12.5px;font-weight:600}
.jn span.hl{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.jn i{width:18px;height:1px;background:var(--border-2);margin:0 2px}
table.inv{width:100%;border-collapse:collapse;font-size:13px}
table.inv th{text-align:left;color:var(--muted);font-weight:600;font-size:12px;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--surface-2)}
table.inv td{padding:11px 14px;border-bottom:1px solid var(--border);color:var(--text-2);vertical-align:top}
table.inv td:first-child{font-weight:700;color:var(--text);white-space:nowrap}
.tk{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.tk div{border:1px solid var(--border);border-radius:12px;padding:12px 14px;background:var(--surface-2);min-width:130px}
.tk small{color:var(--muted);display:block;font-size:11.5px;margin-bottom:3px}.tk b{font-size:14px}
.sw2{display:flex;gap:8px;margin-top:10px}.sw2 i{width:34px;height:34px;border-radius:10px;display:block;border:1px solid var(--border)}
/* ---------- phone ---------- */
.dev{background:#0b0c0f;padding:8px;border-radius:46px;box-shadow:0 20px 50px rgba(16,24,40,.18),0 2px 6px rgba(16,24,40,.12);width:max-content}
html[data-mode=dark] .dev{background:#2a2e38}
.ph{width:324px;height:680px;border-radius:38px;background:var(--bg);color:var(--text);overflow:hidden;display:flex;flex-direction:column;position:relative;font-size:13px;line-height:1.35}
.ph.drv{font-size:16px}
.ph.ml{font-family:'Noto Sans Malayalam','Plus Jakarta Sans',sans-serif}
.sb{height:32px;display:flex;justify-content:space-between;align-items:center;padding:6px 24px 0;font-size:12px;font-weight:700;flex:none;z-index:2}
.sb .r{display:flex;gap:6px;align-items:center}
.sb .sig{display:flex;gap:2px;align-items:flex-end}.sb .sig i{width:3px;background:currentColor;border-radius:1px;display:block}
.sb .bat{width:20px;height:10px;border:1.5px solid currentColor;border-radius:3px;position:relative}.sb .bat::after{content:"";position:absolute;inset:1.5px;right:5px;background:currentColor;border-radius:1px}
.ab{display:flex;align-items:center;gap:10px;padding:8px 16px 10px;flex:none}
.ab h2{flex:1;font-size:19px;font-weight:800;letter-spacing:-.01em}
.ph.drv .ab h2{font-size:22px}
.ib{width:38px;height:38px;border-radius:12px;border:1px solid var(--border);background:var(--surface);display:grid;place-items:center;color:var(--text-2);position:relative;flex:none}
.ib .pip{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--crit);border:2px solid var(--surface)}
.scr{flex:1;overflow:hidden;padding:0 16px 14px;display:flex;flex-direction:column;gap:12px;min-height:0}
.scr.c{justify-content:center;align-items:center;text-align:center}
.bn{height:68px;flex:none;border-top:1px solid var(--border);background:var(--surface);display:flex;padding-bottom:6px}
.bn div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--muted)}
.ph.drv .bn{height:76px}.ph.drv .bn div{font-size:12.5px}
.bn div.on{color:var(--accent)}
.bn div.on svg{background:var(--accent-soft);width:46px;height:28px;padding:4px 13px;border-radius:14px;box-sizing:border-box}
.c1{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px}
.row{display:flex;align-items:center;gap:10px}.g{flex:1;min-width:0}.col{display:flex;flex-direction:column;gap:8px}
.mut{color:var(--muted)}.sm{font-size:11.5px}.xs{font-size:10.5px}.b{font-weight:700}.xb{font-weight:800}.tc{text-align:center}
.h1{font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.2}.ph.drv .h1{font-size:26px}
.btn{height:46px;border-radius:14px;background:var(--accent);color:var(--accent-ink);border:0;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;flex:none}
.btn.o{background:var(--surface);color:var(--text);border:1px solid var(--border-2)}
.btn.ok{background:var(--ok);color:#fff}.btn.no{background:var(--crit);color:#fff}
.btn.t{background:none;color:var(--accent);height:36px}
.btn.xl{height:64px;font-size:20px;border-radius:20px}
.btn.lg{height:56px;font-size:17px;border-radius:18px}
.btn.sm{height:34px;font-size:12px;border-radius:10px;width:auto;padding:0 12px}
.inp{height:48px;border:1px solid var(--border-2);border-radius:12px;padding:0 14px;display:flex;align-items:center;gap:10px;color:var(--text);background:var(--surface);font-weight:500}
.inp.ph0{color:var(--muted)}
.ph.drv .inp{height:58px;font-size:18px;border-radius:14px}
.lbl{font-size:11.5px;font-weight:600;color:var(--text-2);margin-bottom:6px}
.ph.drv .lbl{font-size:14px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px 3px 7px;border-radius:99px;font-size:11px;font-weight:700;color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent);white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.ph.drv .chip{font-size:13px;padding:4px 11px 4px 9px}
.k-ok{--c:var(--ok)}.k-warn{--c:var(--warn)}.k-crit{--c:var(--crit)}.k-info{--c:var(--info)}.k-acc{--c:var(--accent)}.k-neu{--c:var(--neutral)}
.av{width:38px;height:38px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:800;font-size:12.5px;flex:none}
.av.l{width:72px;height:72px;font-size:24px}
.ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.ico.ok{background:color-mix(in srgb,var(--ok) 13%,transparent);color:var(--ok)}.ico.warn{background:color-mix(in srgb,var(--warn) 13%,transparent);color:var(--warn)}.ico.crit{background:color-mix(in srgb,var(--crit) 13%,transparent);color:var(--crit)}
.bar0{height:6px;border-radius:3px;background:var(--surface-2);border:1px solid var(--border);overflow:hidden}.bar0 i{display:block;height:100%;background:var(--accent)}
.list>div{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--border)}.list>div:last-child{border:0}
.ph.drv .list>div{padding:16px 0}
.kp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kp .c1{padding:12px}.kp b{font-size:24px;font-weight:800;letter-spacing:-.02em;display:block;margin-top:4px}
.seg2{display:flex;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:3px;gap:2px}
.seg2 div{flex:1;text-align:center;padding:8px 4px;border-radius:9px;font-weight:600;font-size:12px;color:var(--text-2)}
.seg2 div.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:26px 26px 0 0;padding:10px 18px 20px;box-shadow:0 -10px 40px rgba(0,0,0,.18);display:flex;flex-direction:column;gap:12px;z-index:5}
.sheet::before{content:"";width:38px;height:4px;border-radius:2px;background:var(--border-2);margin:0 auto 4px}
.dim{position:absolute;inset:0;background:rgba(10,12,16,.45);z-index:4}
.tgl{width:42px;height:24px;border-radius:99px;background:var(--border-2);position:relative;flex:none}.tgl::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.tgl.on{background:var(--accent)}.tgl.on::after{left:21px}
.rad{width:22px;height:22px;border-radius:50%;border:2px solid var(--border-2);flex:none;display:grid;place-items:center}.rad.on{border-color:var(--accent)}.rad.on::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent)}
.steps{display:flex;gap:6px}.steps i{flex:1;height:5px;border-radius:3px;background:var(--border-2)}.steps i.on{background:var(--accent)}
.key{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.key div{height:56px;border-radius:16px;background:var(--surface);border:1px solid var(--border);display:grid;place-items:center;font-size:24px;font-weight:700}
.pin{display:flex;gap:12px;justify-content:center}.pin i{width:18px;height:18px;border-radius:50%;border:2px solid var(--border-2)}.pin i.on{background:var(--accent);border-color:var(--accent)}
.tl{position:relative;padding-left:22px}.tl::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--border)}
.tl div{position:relative;padding-bottom:12px}.tl div::before{content:"";position:absolute;left:-22px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:3px solid var(--bg);box-shadow:0 0 0 1px var(--accent)}
.tl div.p::before{background:var(--bg);box-shadow:0 0 0 1px var(--border-2)}.tl div.p b{color:var(--muted)}
.tl b{display:block;font-size:12.5px}.tl small{color:var(--muted);font-size:11px}
.ph.drv .tl b{font-size:17px}.ph.drv .tl small{font-size:13px}
.hero{background:var(--accent);color:var(--accent-ink);border-radius:20px;padding:16px}
.photo{height:96px;border-radius:14px;border:1.5px dashed var(--border-2);display:grid;place-items:center;color:var(--muted);background:var(--surface);text-align:center;font-size:12px;gap:4px}
.photo.f{border:0;background:linear-gradient(135deg,var(--accent-soft),var(--surface-2));color:var(--accent)}
.fab{position:absolute;right:16px;bottom:88px;width:54px;height:54px;border-radius:18px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 8px 20px rgba(0,0,0,.22);z-index:3}
.sosb{position:absolute;right:14px;bottom:92px;width:62px;height:62px;border-radius:50%;background:var(--crit);color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px;box-shadow:0 8px 20px rgba(201,52,47,.4);z-index:3}
.mapbox{position:relative;flex:1;border-radius:18px;overflow:hidden;border:1px solid var(--border);background:var(--map-sea);min-height:0}
.mapbox svg{width:100%;height:100%;display:block}
.attr{position:absolute;left:8px;bottom:5px;font-size:9px;color:var(--muted)}
.pulse{position:relative;width:110px;height:110px;margin:0 auto}
.pulse i{position:absolute;inset:0;border-radius:50%;background:rgba(255,255,255,.18)}
.pulse i:nth-child(2){inset:14px;background:rgba(255,255,255,.22)}.pulse span{position:absolute;inset:28px;border-radius:50%;background:#fff;color:var(--accent);display:grid;place-items:center}
.ph.dark0{background:var(--accent);color:var(--accent-ink)}
.note{font-size:11px;color:var(--muted);text-align:center;line-height:1.5}
.cd{font-family:ui-monospace,monospace}
@media(max-width:700px){.bar,main{padding-left:16px;padding-right:16px}.ctl{margin-left:0}}
</style>
</head>
<body>
<header class="top"><div class="bar">
  <div class="brand"><div class="logo"><svg class="i" viewBox="0 0 24 24"><path d="M2 6h11v10H2zM13 9h4l3 3v4h-7"/><circle cx="6" cy="18" r="2"/><circle cx="17" cy="18" r="2"/></svg></div><div><b>TruckConnect</b><small>Android app · UI screens v2.1</small></div></div>
  <nav class="tabs" id="tabs"></nav>
  <div class="ctl">
    <div class="sw" id="sw"></div>
    <div class="seg" id="mode"><button data-m="light" class="on">Light</button><button data-m="dark">Dark</button></div>
    <div class="seg" id="lang" title="Driver screens language"><button data-l="en" class="on">EN</button><button data-l="ml">മലയാളം</button></div>
  </div>
</div></header>
<main id="main"></main>

<script>
const $=(s,r=document)=>r.querySelector(s);
let theme='indigo',mode='light',lang='en',tab='overview';

}

S.dnotif=()=>`${ab(t('Alerts'))}<div class="scr"><div class="list c1" style="padding:0 14px">${[['truck','New job · Kasaragod','6:00 am','acc'],['check','Delivered · TC-…125','Yesterday','ok'],['warn','Licence expires in 5 days','2 days ago','warn'],['download','New app version','3 days ago','acc']].map(x=>`<div><span class="ico ${x[3]==='ok'?'ok':x[3]==='warn'?'warn':''}">${ic(x[0],22)}</span><div class="g"><b style="font-size:15px">${x[1]}</b><div class="mut sm">${x[2]}</div></div></div>`).join('')}</div></div>${bn(DRV(),2)}`;
S.dprofile=()=>`${ab(t('Profile'),{right:`<div class="ib">${ic('cog')}</div>`})}<div class="scr"><div class="col" style="align-items:center;gap:6px"><span class="av l">SK</span><div class="b" style="font-size:20px">Suresh Kumar</div>${chip('ok','Approved')}</div>
 <div class="c1 list" style="padding:0 14px"><div><span class="g mut">Vehicle</span><b>KL-07-AZ-1200</b></div><div><span class="g mut">Licence</span><b>20 Jun 2027</b></div><div><span class="g mut">${t('Language')}</span><b>മലയാളം</b></div></div>
 <div class="btn lg o" style="color:var(--crit);margin-top:auto">${ic('logout',22)}${t('Log out')}</div></div>${bn(DRV(),3)}`;
/* ---- SETTINGS & SYSTEM ---- */

S.setA=()=>`${ab('Settings',{back:1})}<div class="scr"><div class="c1 row">${av('Anil Kumar')}<div class="g"><div class="b">Anil Kumar</div><div class="mut xs">anil@truckconnect.in</div></div>${ic('edit',18)}</div>
 <div class="c1 list" style="padding:2px 14px">${[['user','Profile','Name, phone, email'],['palette','Theme','Indigo · Auto'],['globe','Language','English'],['bell','Notifications','Alerts & sounds'],['lock','Security','App lock, sessions'],['help','Help','Guides & support'],['tag','App version','v2.1.0']].map(setRow).join('')}</div><div class="note">Theme choice syncs to your profile</div></div>`;
S.setD=()=>`${ab(t('Settings'),{back:1})}<div class="scr" style="gap:10px"><div class="c1 list" style="padding:0 14px">${[['palette','Theme',''],['globe',t('Language'),lang==='ml'?'മലയാളം':'English'],['vol','Voice read-out','On'],['bell','Notifications',''],['help',t('Help'),'']].map(x=>`<div style="padding:17px 0"><span class="ico">${ic(x[0],22)}</span><div class="g"><b>${x[1]}</b>${x[2]?`<div class="mut sm">${x[2]}</div>`:''}</div>${ic('chev',18)}</div>`).join('')}</div>
 <div class="c1 col"><b>Text size</b><div class="seg2" style="font-size:15px"><div>Normal</div><div class="on">Large</div><div>Extra large</div></div></div></div>`;
S.theme=()=>`${ab('Theme',{back:1})}<div class="scr"><div class="seg2"><div>Light</div><div>Dark</div><div class="on">Auto</div></div><div class="mut sm">Pick a colour theme. All meet WCAG AA contrast.</div>
 <div class="kp">${[['Indigo','#4f46e5',1],['Emerald','#047857',0],['Graphite','#27272a',0],['Sunset','#d9480f',0]].map(x=>`<div class="c1 col" style="${x[2]?'border-color:var(--accent);border-width:2px':''}"><div style="height:56px;border-radius:12px;background:${x[1]};display:grid;place-items:center;color:#fff">${x[2]?ic('check',24):''}</div><b class="sm">${x[0]}</b></div>`).join('')}</div>
 <div class="c1 col" style="gap:8px"><div class="mut xs">Preview</div><div class="btn">Primary button</div><div class="row">${chip('acc','In transit')}${chip('ok','Delivered')}${chip('warn','Delayed')}</div></div></div>`;
S.language=()=>`${ab(t('Language'),{back:1})}<div class="scr" style="gap:10px"><div class="mut sm">Driver screens default to Malayalam</div>${[['മലയാളം','Malayalam',1],['English','English',0]].map(x=>`<div class="c1 row" style="padding:16px;${x[2]?'border-color:var(--accent)':''}"><div class="rad ${x[2]?'on':''}"></div><div class="g"><b style="font-size:17px">${x[0]}</b><div class="mut sm">${x[1]}</div></div></div>`).join('')}<div class="c1 row">${ic('globe',20)}<span class="sm mut">Switch any time. No restart needed.</span></div></div>`;
S.notifs=()=>`${ab('Notifications',{back:1})}<div class="scr"><div class="c1 list" style="padding:0 14px">${[['Job alerts (loud)',1],['Cancellation & reassignment',1],['Repeat push if not opened',1],['Delay and SOS alerts',1],['Update reminders',0],['Daily summary',0]].map(x=>`<div><span class="g b sm">${x[0]}</span><div class="tgl ${x[1]?'on':''}"></div></div>`).join('')}</div><div class="c1 row">${ic('bell',20)}<div class="sm mut">Channels: Job alerts · Updates · General</div></div></div>`;
S.security=()=>`${ab('Security',{back:1})}<div class="scr"><div class="c1 list" style="padding:0 14px"><div><span class="ico" style="width:34px;height:34px">${ic('lock',18)}</span><span class="g b sm">App lock (PIN / biometric)</span><div class="tgl on"></div></div><div><span class="ico" style="width:34px;height:34px">${ic('shield',18)}</span><span class="g b sm">2-step verification</span><div class="tgl on"></div></div><div><span class="ico" style="width:34px;height:34px">${ic('key',18)}</span><span class="g b sm">Change password</span>${ic('chev',16)}</div></div>
 <div class="b sm" style="margin-top:4px">Signed-in devices</div>${[['Redmi Note 11 · this device','Active now',1],['Samsung A14','2 days ago',0]].map(x=>`<div class="c1 row" style="padding:12px"><div class="ico">${ic('phone',20)}</div><div class="g"><div class="b sm">${x[0]}</div><div class="mut xs">${x[1]}</div></div>${x[2]?chip('ok','Current'):'<div class="btn o sm" style="color:var(--crit)">Revoke</div>'}</div>`).join('')}</div>`;
S.help=()=>`${ab(t('Help'),{back:1})}<div class="scr" style="gap:10px"><div class="hero row" style="gap:12px">${ic('play',30)}<div class="g"><b>Watch the 2-minute guide</b><div style="opacity:.85;font-size:12px">${lang==='ml'?'മലയാളത്തിൽ':'In Malayalam'}</div></div></div>
 <div class="c1 list" style="padding:0 14px">${[['whatsapp','WhatsApp support','Chat with the office'],['phone',t('Call office'),'+91 484 000 0000'],['doc','How to accept a job','3 steps'],['map','Fix tracking on my phone','Battery settings'],['shield','Privacy & location','DPDP consent']].map(setRow).join('')}</div></div>`;
S.about=()=>`${ab('App version',{back:1})}<div class="scr" style="gap:12px"><div class="col" style="align-items:center;gap:8px;padding:10px 0"><div class="logo" style="width:64px;height:64px;border-radius:20px">${ic('truck',32)}</div><b style="font-size:18px">TruckConnect</b><span class="mut">v2.1.0 (build 21) · direct</span></div>
 <div class="c1 list" style="padding:0 14px"><div><span class="g mut sm">Channel</span><b class="sm">Direct (self-hosted)</b></div><div><span class="g mut sm">Minimum supported</span><b class="sm">v2.0.3</b></div><div><span class="g mut sm">Last checked</span><b class="sm">Today, 9:02 am</b></div></div>
 <div class="c1 col"><b class="sm">What’s new</b><div class="mut sm">• Driver registration and approval<br>• Faster job alerts</div></div><div class="btn" style="margin-top:auto">Check for updates</div></div>`;
S.update=()=>`<div class="scr" style="opacity:.4">${ab(t('Home'))}</div><div class="dim"></div><div class="sheet" style="gap:12px"><div class="row"><div class="ico">${ic('download',22)}</div><div class="g"><b style="font-size:17px">${lang==='ml'?'പുതിയ പതിപ്പ് ലഭ്യമാണ്':'New version available'}</b><div class="mut sm">v2.1.1 · 18 MB</div></div></div>
 <div class="c1 sm" style="line-height:1.6">• ${lang==='ml'?'വേഗത്തിലുള്ള ജോലി അറിയിപ്പ്':'Faster job alerts'}<br>• ${lang==='ml'?'ചെറിയ തകരാറുകൾ പരിഹരിച്ചു':'Small fixes'}</div><div class="bar0"><i style="width:64%"></i></div><div class="mut xs tc">Downloading… 64%</div>
 <div class="row"><div class="btn lg o g">${t('Later')}</div><div class="btn lg g">${t('Update')}</div></div></div>`;
S.install=()=>`<div class="scr c" style="gap:16px;padding:0 22px"><div class="ico warn" style="width:84px;height:84px;border-radius:28px">${ic('shield',42)}</div><div class="h1" style="font-size:22px">Allow installs from TruckConnect</div><div class="mut" style="line-height:1.6;font-size:13px">Android asks once for “Install unknown apps”. Turn it on for TruckConnect, then come back. We check the file’s signature before installing.</div>
 <div class="c1 col" style="width:100%;text-align:left;gap:8px"><div class="row"><span class="av" style="width:28px;height:28px;font-size:12px">1</span><span class="sm">Tap Open settings</span></div><div class="row"><span class="av" style="width:28px;height:28px;font-size:12px">2</span><span class="sm">Switch on Allow from this source</span></div><div class="row"><span class="av" style="width:28px;height:28px;font-size:12px">3</span><span class="sm">Press back and tap Install</span></div></div><div class="btn">Open settings</div></div>`;
S.forced=()=>`<div class="scr c" style="gap:16px;padding:0 24px;background:var(--surface)"><div class="ico crit" style="width:92px;height:92px;border-radius:30px">${ic('warn',44)}</div><div class="h1">${lang==='ml'?'അപ്ഡേറ്റ് ആവശ്യമാണ്':'Update required'}</div><div class="mut" style="line-height:1.6">${lang==='ml'?'തുടരാൻ ഏറ്റവും പുതിയ പതിപ്പ് ഇൻസ്റ്റാൾ ചെയ്യുക':'This version is no longer supported. Install the latest to continue.'}</div>
 <div class="c1 row" style="width:100%"><span class="g mut sm">Installed</span><b class="sm">v2.0.1</b><span class="mut">→</span><b class="sm" style="color:var(--accent)">v2.1.1</b></div><div class="btn xl">${t('Update')}</div><div class="note">Never shown during an active trip</div></div>`;
/* ================= GROUPS ================= */
const G=[
 {id:'auth',title:'Onboarding & access',desc:'Splash, role choice, driver PIN login, self-registration with licence capture, pending approval, admin sign-in and permission setup.',flows:[
  {t:'Launch',tag:'All users',d:'First impression and role entry',s:[['A1','Splash','Brand moment while the session and version check run.','splash'],['A2','Role select','Admin or Driver. One clear primary action each.','role']]},
  {t:'Driver login & registration',tag:'Driver · AUTH-1, AUTH-8',d:'Phone and PIN, no SMS cost. New drivers self-register and wait for approval.',s:[['D1','Driver login','Large keypad, mobile number, PIN. Register link below.','dlogin',1],['D2','Register · mobile & PIN','Step 1 of 3. Set a 4-digit PIN.','reg1',1],['D3','Register · identity','Step 2 of 3. Name and emergency contact.','reg2',1],['D4','Register · licence','Step 3 of 3. Licence details, front and back photos, vehicle type, DPDP consent.','reg3',1],['D5','Pending approval','PENDING_VERIFICATION until an admin approves.','pending',1],['D6','Permissions','Location, notifications and battery, each explained in one card.','perm',1]]},
  {t:'Admin access',tag:'Admin · AUTH-2',d:'Email and password with optional 2-step code',s:[['A3','Admin sign in','Email, password, 2-step verification, keep signed in.','alogin']]}]},
 {id:'admin',title:'Admin & dispatcher',desc:'Everything the owner and dispatchers need on their phone: dashboard, live map, shipments, fleet, driver approvals, reports and alerts.',flows:[
  {t:'Operate',tag:'ADM-1 to ADM-4',d:'Daily dispatch work',s:[['M1','Dashboard','On trip, available, pending, delayed, SOS banner and live trips.','dash'],['M2','Live map','MapLibre with OpenStreetMap. Tap a vehicle for driver, speed, ETA.','map'],['M3','Shipments','Filter by status. One tap to the detail or the + button to create.','ships'],['M4','Shipment detail','Timestamped timeline, reassign or cancel with reason.','shipd'],['M5','New shipment','Capacity warning appears before assigning.','newship'],['M6','Assign driver','Availability shown for every driver. Notifies instantly.','assign']]},
  {t:'Fleet & approvals',tag:'DRV · VEH · AUTH-9',d:'People, vehicles and new driver verification',s:[['M7','Drivers','Search and filter by availability.','drivers'],['M8','Driver detail','Stats, vehicle, licence, device. Reset PIN or revoke device.','driverd'],['M9','Driver approvals','Alerted on every new registration.','approvals'],['M10','Review driver','Inspect details and licence photos. Approve or reject.','review'],['M11','Vehicles','Status and document expiry reminders.','vehicles']]},
  {t:'Insight & control',tag:'ADM-4 to ADM-6, UPD-8',d:'Reports, alerts and release visibility',s:[['M12','Reports','On-time rate, trips per driver, completed vs cancelled, export.','reports'],['M13','Alerts centre','SOS, rejects, delays, no-response and expiring documents.','alerts'],['M14','More','Reports, vehicles, approvals, versions, audit log, settings.','more'],['M15','App versions','Which driver runs which version. Halt or force update.','versions']]}]},
 {id:'driver',title:'Driver',desc:'Built for elderly drivers: Malayalam first, 56 dp minimum buttons, 18 sp text, colour plus icon plus text, three taps for any action.',flows:[
  {t:'Receive & accept',tag:'APP-1 to APP-2',d:'Loud full-screen alert, large Accept and Reject',s:[['V1','Home · no job','Calm empty state, SOS always reachable.','dhome0',1],['V2','Job alert','Full-screen over the lock screen with voice read-out.','jobalert',1],['V3','Reject reason','One tap reason, no typing.','reject',1],['V4','Job details','Pickup, drop, goods. Navigate, call, start trip.','jobdetail',1]]},
  {t:'Run the trip',tag:'APP-3 to APP-6',d:'One big button for the next milestone',s:[['V5','Active trip','Milestone list and a single large next action.','trip',1],['V6','Choose navigation app','Geo intent opens Vela, OsmAnd or Google Maps.','navchoose',1],['V7','Proof of delivery','Photo, receiver name, optional OTP.','pod',1],['V8','Delivered','Confirmation and back to home.','success',1]]},
  {t:'Support',tag:'APP-9, APP-10',d:'History, safety and profile',s:[['V9','History','Past trips with on-time rate.','history',1],['V10','SOS','Hold to send location to the office.','sos',1],['V11','Alerts','In-app notification list.','dnotif',1],['V12','Profile','Vehicle, licence, language, log out.','dprofile',1]]}]},
 {id:'settings',title:'Settings & system',desc:'Themes, language, notifications, security, help and the in-app update flow, shared by both roles.',flows:[
  {t:'Settings',tag:'Section 8',d:'Four themes, light, dark and auto, Malayalam and English',s:[['S1','Settings · admin','Profile, theme, language, notifications, security, help, version.','setA'],['S2','Settings · driver','Larger rows, voice read-out, text size up to extra large.','setD',1],['S3','Theme','Indigo, Emerald, Graphite, Sunset with live preview.','theme'],['S4','Language','Malayalam and English, switch any time.','language',1],['S5','Notifications','Channels and repeat-push options.','notifs'],['S6','Security','App lock, 2-step, signed-in devices.','security'],['S7','Help','Video guide, WhatsApp, call office.','help',1],['S8','App version','Channel, minimum version, release notes.','about']]},
  {t:'In-app updates',tag:'UPD-1 to UPD-7',d:'Self-hosted updater for the free phase, Play flow later',s:[['U1','Update available','Flexible update with progress. Waits until the trip ends.','update',1],['U2','Install permission','One-screen explainer for Install unknown apps.','install'],['U3','Forced update','Blocking when below the minimum version.','forced',1]]}]}
];
/* ================= RENDER ================= */
const total=G.reduce((a,g)=>a+g.flows.reduce((b,f)=>b+f.s.length,0),0);
function fig(s){const[id,name,note,key,drv]=s;return `<figure class="fig"><div class="dev"><div class="ph ${drv?'drv':''} ${drv&&lang==='ml'?'ml':''}">${sb()}${S[key]()}</div></div><figcaption><b><i>${id}</i>${name}</b>${note}</figcaption></figure>`}
function overview(){
  const inv=G.map(g=>`<tr><td>${g.title}</td><td>${g.flows.reduce((b,f)=>b+f.s.length,0)}</td><td>${g.flows.flatMap(f=>f.s.map(x=>x[1])).join(' · ')}</td></tr>`).join('');
  return `<div class="sec-h"><div><h1>TruckConnect Android app</h1><p>Complete screen set for the Admin and Driver roles, from splash to settings. Built on the v2.1 PRD: Kotlin and Jetpack Compose, MapLibre maps, free-phase PIN login with driver self-registration and approval, and the in-app updater.</p></div></div>
  <div class="cards"><div class="card"><div class="big">${total}</div><h3>Screens</h3><p>Across onboarding, admin, driver and settings.</p></div><div class="card"><div class="big">2</div><h3>Roles</h3><p>One app, role-based navigation after login.</p></div><div class="card"><div class="big">4×3</div><h3>Themes</h3><p>Indigo, Emerald, Graphite, Sunset, each in light, dark and auto.</p></div><div class="card"><div class="big">ML · EN</div><h3>Languages</h3><p>Driver screens are Malayalam first. Use the toggle above.</p></div></div>
  <div class="flow"><h2>Core journeys</h2><hr></div>
  <div class="card"><b>Dispatch to delivery</b><div class="journey">${['Admin creates shipment','Assigns driver + vehicle','Driver alerted','Accept','Start trip','Milestones','Photo proof','Admin sees it live'].map((x,i,a)=>`<div class="jn"><span class="${i===3||i===6?'hl':''}">${x}</span>${i<a.length-1?'<i></i>':''}</div>`).join('')}</div>
  <div style="height:18px"></div><b>Driver self-registration</b><div class="journey">${['Register as Driver','Mobile + PIN','Identity','Licence + photos','Pending','Admin approves','Login with PIN'].map((x,i,a)=>`<div class="jn"><span class="${i===4||i===5?'hl':''}">${x}</span>${i<a.length-1?'<i></i>':''}</div>`).join('')}</div></div>
  <div class="flow"><h2>Design system</h2><hr></div>
  <div class="cards"><div class="card"><h3>Typography</h3><p>Plus Jakarta Sans for Latin, Noto Sans Malayalam companion bundled.</p><div class="tk"><div><small>Admin body</small><b>13–14 sp</b></div><div><small>Driver body</small><b>18 sp min</b></div></div></div>
  <div class="card"><h3>Touch targets</h3><p>Large, forgiving, no hidden gestures.</p><div class="tk"><div><small>Driver</small><b>56 dp min</b></div><div><small>Admin</small><b>48 dp min</b></div></div></div>
  <div class="card"><h3>Status language</h3><p>Colour plus icon plus text, never colour alone.</p><div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">${chip('ok','Delivered')}${chip('acc','In transit')}${chip('warn','Delayed')}${chip('crit','Rejected')}${chip('neu','Offline')}</div></div>
  <div class="card"><h3>Spacing & shape</h3><p>4 dp grid, 12 to 20 dp radii, subtle elevation, short fast transitions.</p><div class="tk"><div><small>Grid</small><b>4 dp</b></div><div><small>Contrast</small><b>WCAG AA</b></div></div></div></div>
  <div class="flow"><h2>Screen inventory</h2><hr></div>
  <div class="card" style="padding:0;overflow:hidden"><table class="inv"><thead><tr><th>Section</th><th>Screens</th><th>Includes</th></tr></thead><tbody>${inv}</tbody></table></div>`;
}
function renderTabs(){
  $('#tabs').innerHTML=[['overview','Overview',''],...G.map(g=>[g.id,g.title.split(' &')[0],g.flows.reduce((b,f)=>b+f.s.length,0)])].map(x=>`<button class="tab ${tab===x[0]?'on':''}" data-t="${x[0]}">${x[1]}${x[2]!==''?`<span>${x[2]}</span>`:''}</button>`).join('');
}
function render(){
  renderTabs();
  if(tab==='overview'){$('#main').innerHTML=overview();return}
  const g=G.find(x=>x.id===tab);
  $('#main').innerHTML=`<div class="sec-h"><div><h1>${g.title}</h1><p>${g.desc}</p></div></div>`+g.flows.map(f=>`<div class="flow"><h2>${f.t}</h2><span class="tag">${f.tag}</span><p>${f.d}</p><hr></div><div class="grid">${f.s.map(fig).join('')}</div>`).join('');
}
/* controls */
const TH=[['indigo','#4f46e5'],['emerald','#047857'],['graphite','#27272a'],['sunset','#d9480f']];
$('#sw').innerHTML=TH.map(t=>`<button data-th="${t[0]}" style="background:${t[1]}" title="${t[0]}" class="${t[0]===theme?'on':''}"></button>`).join('');
document.addEventListener('click',e=>{
  let b;
  if(b=e.target.closest('[data-t]')){tab=b.dataset.t;render();window.scrollTo(0,0);try{history.replaceState(null,'','#'+tab)}catch(_){}}
  else if(b=e.target.closest('[data-th]')){theme=b.dataset.th;document.documentElement.dataset.theme=theme;document.querySelectorAll('#sw button').forEach(x=>x.classList.toggle('on',x===b))}
  else if(b=e.target.closest('[data-m]')){mode=b.dataset.m;document.documentElement.dataset.mode=mode;document.querySelectorAll('#mode button').forEach(x=>x.classList.toggle('on',x===b))}
  else if(b=e.target.closest('[data-l]')){lang=b.dataset.l;document.querySelectorAll('#lang button').forEach(x=>x.classList.toggle('on',x===b));render()}
});
const h=(location.hash||'').slice(1);if(h==='overview'||G.some(g=>g.id===h))tab=h;
render();
</script>
</body>
</html>
